<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Illustrator Quiz 4 — Tracing & Pathfinder</title>
<style>
*{box-sizing:border-box}body{font:16px system-ui,Arial,sans-serif;background:#eef3fa;color:#142b47;margin:0}.wrap{max-width:820px;margin:30px auto;padding:25px;background:white;border-radius:14px;box-shadow:0 5px 22px #b5c3d3}h1{color:#183e75}fieldset{border:1px solid #c8d6e7;border-radius:9px;margin:20px 0;padding:18px}legend{font-weight:700;line-height:1.5}label{display:block;padding:10px;margin:5px 0;border-radius:6px;cursor:pointer}label:hover{background:#f0f5ff}label input{margin-right:8px}button{background:#1b4c91;color:white;border:0;padding:12px 20px;border-radius:8px;font-size:16px;cursor:pointer;margin:4px}button.secondary{background:#e2eaf6;color:#183e75}.good{background:#e1f6e6}.bad{background:#ffe5e5}#result{font-size:21px;font-weight:bold;padding:15px 0}#warning{color:#a32626;font-weight:600}#progress{color:#53657b}fieldset.missing{border:2px solid #c33} .review{font-size:14px;margin:8px 0;color:#155b37}@media(max-width:600px){.wrap{margin:0;border-radius:0;padding:18px}}@media print{button,#warning{display:none}.wrap{box-shadow:none;margin:0}fieldset{break-inside:avoid}}
</style></head><body><main class="wrap"><h1>Quiz 4: Tracing & Pathfinder • Episodes 13–16</h1><p>Gareth David Studio • Illustrator beginner course • 15 questions • Select one answer for each question.</p><p id="progress" aria-live="polite">0 of 15 answered</p><form id="quiz" novalidate></form><p id="warning" role="alert"></p><button type="button" id="grade">Submit & Grade Quiz</button><button type="button" id="retake" class="secondary">Retake Quiz</button><button type="button" id="print" class="secondary" hidden>Print Results</button><div id="result" role="status" aria-live="polite"></div></main>
<script>
const Q=[{"question": "Which command imports a sketch as a linked or embedded image?", "options": ["File > Place", "Object > Expand", "Select > Same", "Type > Glyphs"], "answer": 0}, {"question": "Why lock a placed sketch layer while tracing?", "options": ["Turn it into editable type", "Prevent accidentally moving the reference", "Make the sketch print brighter", "Convert it to CMYK"], "answer": 1}, {"question": "What is Image Trace used for?", "options": ["Changing the zoom level", "Creating artboards", "Converting raster imagery into vector paths", "Adding editable paragraphs"], "answer": 2}, {"question": "What command turns an Image Trace result into editable vector shapes?", "options": ["Save for Web", "Package", "Flatten Transparency only", "Expand"], "answer": 3}, {"question": "Which Pathfinder option combines selected shapes into one?", "options": ["Unite", "Minus Front", "Intersect", "Exclude"], "answer": 0}, {"question": "Which Pathfinder option removes the front shape from the back shape?", "options": ["Divide", "Minus Front", "Unite", "Intersect"], "answer": 1}, {"question": "Which Pathfinder option retains only overlapping areas?", "options": ["Outline", "Merge Layers", "Intersect", "Unite"], "answer": 2}, {"question": "Why simplify a traced path?", "options": ["Increase bitmap resolution", "Change paper size", "Add more swatches", "Reduce unnecessary anchor points"], "answer": 3}, {"question": "What is a closed path?", "options": ["A path whose start and end connect", "A path with no fill", "A path on a locked layer", "A path that cannot be edited"], "answer": 0}, {"question": "What is the advantage of manually tracing a simple logo?", "options": ["Removal of all strokes", "Greater control over clean curves and points", "Automatic font installation", "Guaranteed photo realism"], "answer": 1}, {"question": "Which panel can align several selected shapes precisely?", "options": ["Swatches", "Links", "Align", "Character"], "answer": 2}, {"question": "What does Pathfinder Divide do?", "options": ["Deletes the whole artboard", "Exports separate PNG files", "Changes fill to stroke", "Splits overlapping shapes into separate regions"], "answer": 3}, {"question": "What is the role of direction handles?", "options": ["Control the curve entering or leaving an anchor", "Set the print bleed", "Choose a font family", "Toggle rulers"], "answer": 0}, {"question": "Which view can help inspect the underlying paths without fills?", "options": ["Pixel Preview only", "Outline View", "Presentation Mode", "Trim View only"], "answer": 1}, {"question": "Why keep the reference image on a separate layer?", "options": ["To remove vector handles", "To automatically apply gradients", "To trace independently without altering the source", "To force image compression"], "answer": 2}];
const form=document.getElementById('quiz'), progress=document.getElementById('progress'), warning=document.getElementById('warning'), result=document.getElementById('result'), gradeButton=document.getElementById('grade'), printButton=document.getElementById('print');
let graded=false;
Q.forEach((q,i)=>{const fs=document.createElement('fieldset');fs.id='q'+i;const legend=document.createElement('legend');legend.textContent=(i+1)+'. '+q.question;fs.append(legend);q.options.forEach((option,j)=>{const label=document.createElement('label');const input=document.createElement('input');input.type='radio';input.name='q'+i;input.value=String(j);const span=document.createElement('span');span.textContent=String.fromCharCode(65+j)+'. '+option;label.append(input,span);fs.append(label)});form.append(fs)});
function updateProgress(){const answered=Q.filter((_,i)=>form.querySelector('input[name="q'+i+'"]:checked')).length;progress.textContent=answered+' of '+Q.length+' answered';}
form.addEventListener('change',e=>{if(graded)return;const field=e.target.closest('fieldset');if(field)field.classList.remove('missing');warning.textContent='';updateProgress()});
function grade(){if(graded)return;const missing=[];Q.forEach((_,i)=>{const field=document.getElementById('q'+i);const empty=!field.querySelector('input:checked');field.classList.toggle('missing',empty);if(empty)missing.push(i+1)});if(missing.length){warning.textContent='Please answer question'+(missing.length>1?'s ':' ')+missing.join(', ')+' before submitting.';document.getElementById('q'+(missing[0]-1)).scrollIntoView({behavior:'smooth',block:'center'});return}graded=true;warning.textContent='';let score=0;Q.forEach((q,i)=>{const fs=document.getElementById('q'+i),selected=Number(fs.querySelector('input:checked').value);if(selected===q.answer)score++;fs.querySelectorAll('label').forEach((label,j)=>{label.classList.toggle('good',j===q.answer);label.classList.toggle('bad',j===selected&&selected!==q.answer)});fs.querySelectorAll('input').forEach(input=>input.disabled=true);const feedback=document.createElement('p');feedback.className='review';feedback.textContent=(selected===q.answer?'✓ Correct. ':'✗ Incorrect. ')+'Correct answer: '+String.fromCharCode(65+q.answer)+'. '+q.options[q.answer];fs.append(feedback)});result.textContent='Your score: '+score+' / '+Q.length+' ('+Math.round(score/Q.length*100)+'%). Green = correct answer; red = your incorrect selection.';gradeButton.disabled=true;printButton.hidden=false;result.scrollIntoView({behavior:'smooth',block:'center'})}
function retake(){graded=false;form.reset();form.querySelectorAll('input').forEach(input=>input.disabled=false);form.querySelectorAll('label').forEach(label=>label.classList.remove('good','bad'));form.querySelectorAll('fieldset').forEach(fs=>{fs.classList.remove('missing');fs.querySelectorAll('.review').forEach(el=>el.remove())});warning.textContent='';result.textContent='';gradeButton.disabled=false;printButton.hidden=true;updateProgress();window.scrollTo({top:0,behavior:'smooth'})}
gradeButton.addEventListener('click',grade);document.getElementById('retake').addEventListener('click',retake);printButton.addEventListener('click',()=>window.print());updateProgress();
</script></body></html>
